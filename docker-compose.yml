version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: smart-ats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smart-ats

  backend:
    build: ./backend
    container_name: smart-ats-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/smart-ats
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongo
      - ai-service
    volumes:
      - ./backend/uploads:/app/uploads

  ai-service:
    build: ./backend/ai-service
    container_name: smart-ats-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  frontend:
    build: ./frontend
    container_name: smart-ats-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
